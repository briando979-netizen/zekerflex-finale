# De iPhone-app bouwen op een Mac van Codemagic (gratis tot 500 minuten per maand), als
# alternatief voor .github/workflows/ios.yml. Zie ios-app/README.md.
# In Codemagic: Settings → Integrations → Developer Portal → sleutel "zekerflex" (zo heet hij,
# met kleine letters; Key ID JB339NP4WP). ios_signing gebruikt alleen een certificaat en
# profiel die al in Codemagic staan (Code signing identities): de volgorde staat in
# ios-app/README.md. Daarna deze workflow met de hand starten. xcode: latest = Xcode 26+,
# wat Apple sinds 28 april 2026 eist.
workflows:
  ios-app:
    name: ZekerFlex voor iPhone
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      # de naam van de sleutel in Codemagic, letterlijk
      app_store_connect: zekerflex
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zekerflex.app
    scripts:
      - name: Xcode-project maken (XcodeGen)
        script: |
          cd ios-app
          brew install xcodegen
          xcodegen generate
      - name: Ondertekenen
        script: xcode-project use-profiles --project ios-app/ZekerFlex.xcodeproj
      - name: Bouwen
        script: |
          cd ios-app
          xcode-project build-ipa \
            --project ZekerFlex.xcodeproj \
            --scheme ZekerFlex \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - ios-app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # alleen uploaden: dan staat hij in TestFlight voor het eigen team (interne testers),
        # zonder beoordeling door Apple. Externe testers pas later (vraagt testinformatie).
        submit_to_testflight: false
