# ZekerFlex Sovereign Box — productie-stack voor een VPS met EIGEN PUBLIEK IP
# (TransIP, Hetzner, …). Dit is de variant van docker-compose.prod.yml zonder
# Cloudflare-tunnel: verkeer komt rechtstreeks binnen via Caddy op poort 80/443.
# Gebruik dit wanneer je domein-DNS NIET bij Cloudflare staat (zoals bij TransIP).
#
#   cp deploy/.env.production.example .env.production   # of laat deploy-vps.sh 'm genereren
#   docker compose --env-file .env.production -f docker-compose.vps.yml up -d --build
#
# Inbound poorten: 80 + 443 (Caddy), en voor bellen 3478/udp+tcp en 49160:49260/udp
# (coturn). Houd de rest van de firewall dicht, op SSH na.
# TLS: zet SITE_ADDRESS in .env.production op je domein zodra de A-record naar
# deze VPS wijst; Caddy haalt dan automatisch een Let's Encrypt-certificaat op.
#
# AI op de eigen server (16 GB sinds 7 nov): het taalmodel (ollama) en de
# spraakherkenning (whisper) zitten hier wel in. Beeldgeneratie (sd) niet: zonder
# grafische kaart duurt een foto minuten en vraagt hij 4–6 GB. Een externe LLM kan
# via LLM_API_KEY + LLM_BASE_URL in .env.production.
#
# Dit bestand migreert of seedt de database nooit. Zie deploy/README.md.

name: zekerflex

# Versies van kant-en-klare images staan vast (exact de versies die op 6 nov 2026 draaiden):
# een `pull` brengt dan nooit stil een nieuwe grote versie binnen. Bijwerken = hier bewust verhogen.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Vaste sleutel voor server-acties (zie Dockerfile): open formulieren overleven een uitrol.
      args:
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    image: zekerflex-app:latest
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://zekerflex:${POSTGRES_PASSWORD}@postgres:5432/zekerflex?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Lokaal taalmodel (Ollama) zodat Jarvis/AI werkt zonder externe dienst.
      # Klein model i.v.m. CPU-only VPS; vervang door LLM_API_KEY/LLM_BASE_URL in
      # .env.production voor een sneller extern model.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-gemma3:4b}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-gemma3:4b}
      # Reserve als het externe model (Gemini, gratis laag) even niet antwoordt: de eigen Ollama.
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-http://ollama:11434/v1}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gemma3:4b}
      # Spraakherkenning (Whisper op de eigen server, dienst "whisper" hieronder): de microfoon in Jarvis
      # en de spraakinvoer in de werker-app (lib/asr/transcribe.ts). Proef 7 nov: 2 s per zin.
      WHISPER_ENABLED: ${WHISPER_ENABLED:-true}
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-http://whisper:8000/v1}
      WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
      # ZekerFlex Kaart leest zijn data alleen via deze variabele (zie app/kaart-data)
      KAART_DATA_DIR: /app/kaart-data
      # Rapportages (lib/bi): Metabase op het interne netwerk; het publieke adres via Caddy
      METABASE_URL: ${METABASE_URL:-http://metabase:3000}
      METABASE_PUBLIC_URL: ${METABASE_PUBLIC_URL:-https://${METABASE_HOST:-bi.37-97-226-24.sslip.io}}
      # Kennisbank (lib/kennisbank, lib/oidc): Outline op het interne netwerk; publiek via Caddy
      OUTLINE_URL: ${OUTLINE_URL:-http://outline:3000}
      OUTLINE_PUBLIC_URL: ${OUTLINE_PUBLIC_URL:-https://${OUTLINE_HOST:-kennis.37-97-226-24.sslip.io}}
    volumes:
      - app-storage:/app/storage
      # Back-ups van beheerde klantsites: eigen volume, niet in onze eigen nachtelijke back-up.
      - site-backups:/app/site-backups
      # Omgezette foto's van next/image: blijven bewaard bij een deploy.
      - next-cache:/app/.next/cache
      # Alleen-lezen: de app controleert de nachtelijke back-up (lib/ops/backup.ts).
      - ./backups:/backups:ro
      # Alleen-lezen: kaartdata van ZekerFlex Kaart (tegels NL, lettertypes), niet in git;
      # ophalen/bijwerken met deploy/kaart/haal-kaart.sh, geserveerd door app/kaart-data.
      - ./kaart-data:/app/kaart-data:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal, bouwer-toegang, bronnen]
    # Geen `ports:` — alles loopt via Caddy.

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    # Alleen wat de Caddyfile leest, niet heel .env.production: anders maakt elke
    # nieuwe sleutel daarin (van welke functie ook) Caddy bij de volgende uitrol
    # opnieuw aan, en is de hele site even weg (4 nov: inloggen gaf de foutpagina).
    # Caddy hoeft ook geen geheimen van de app te kennen. Standaard = die in de Caddyfile.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      BOUWER_VOORBEELD_HOST: ${BOUWER_VOORBEELD_HOST:-voorbeeld.37-97-226-24.sslip.io}
      METABASE_HOST: ${METABASE_HOST:-bi.37-97-226-24.sslip.io}
      OUTLINE_HOST: ${OUTLINE_HOST:-kennis.37-97-226-24.sslip.io}
      FORGEJO_HOST: ${FORGEJO_HOST:-git.37-97-226-24.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # De map, niet het bestand: tar vervangt de Caddyfile bij elke uitrol (nieuwe
      # inode), en via de map ziet de draaiende caddy die meteen, zodat
      # vps-update.sh hem zonder onderbreking kan herladen.
      - ./deploy/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
      # Toegangslog (JSON, zonder cookies/sleutels) voor de aanvalsbescherming; crowdsec leest mee.
      - caddy-logs:/var/log/caddy
    depends_on:
      app: { condition: service_started }
    # git: de eigen Git-server (Forgejo) zit alleen op dat netwerk
    networks: [internal, bouwer-toegang, git]

  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    # init: een klein init-proces is PID 1, niet de postmaster. Zonder dat erft de
    # postmaster elk `docker exec … psql` (live-zetter, sessies, scripts) als kind;
    # eindigt zo'n psql met exitcode ≥ 2 (SQL-fout met ON_ERROR_STOP, kapotte pipe),
    # dan ziet Postgres 17+ dat als een gecrashte backend en herstart hij ALLE
    # verbindingen ("terminating any other active server processes"; 6 nov, twee keer).
    init: true
    # de database als laatste kandidaat voor de OOM-killer (Ollama/next build eerder)
    oom_score_adj: -900
    environment:
      POSTGRES_USER: zekerflex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: zekerflex
    volumes:
      # Postgres 18+ image wil één mount op /var/lib/postgresql (data komt in een
      # versie-submap); /var/lib/postgresql/data zoals bij <=16 laat 18 crashen.
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zekerflex -d zekerflex"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Nachtelijke back-up van de database + uploads, met proef-terugzetting in een
  # wegwerp-database en elke zondag een diepgaande hersteltest (tabel voor tabel
  # vergeleken met het moment van de back-up). Met BACKUP_PASSPHRASE komt er een
  # versleutelde kopie bij, met BACKUP_OFFSITE gaat die naar een plek buiten de
  # server (scp of WebDAV). Schrijft naar ./backups; de nieuwste 14 blijven staan.
  # Zie deploy/backup/entrypoint.sh en deploy/DISASTER-RECOVERY.md.
  backup:
    build:
      context: deploy/backup
    image: zekerflex-backup:latest
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: zekerflex
      PGDATABASE: zekerflex
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      # eigenaar van de back-upbestanden op de host (de deploy-gebruiker), zodat
      # ze zonder sudo naar een andere computer gekopieerd kunnen worden
      BACKUP_UID: ${BACKUP_UID:-1000}
      # wachtwoordzin voor de versleutelde kopie (.enc); bewaar hem óók buiten de server,
      # want zonder is de kopie waardeloos. Leeg = geen versleutelde kopie.
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      # kopie buiten de server: scp://gebruiker@host/pad (sleutel in ./offsite/id_ed25519 +
      # known_hosts) of https://host/webdav/pad/ met BACKUP_OFFSITE_USER/PASS. Leeg = uit.
      BACKUP_OFFSITE: ${BACKUP_OFFSITE:-}
      BACKUP_OFFSITE_USER: ${BACKUP_OFFSITE_USER:-}
      BACKUP_OFFSITE_PASS: ${BACKUP_OFFSITE_PASS:-}
    volumes:
      - ./deploy/backup/entrypoint.sh:/backup.sh:ro
      - ./backups:/backups
      - app-storage:/storage:ro
      # de eigen Git-server (Forgejo). Niet alleen-lezen: de momentopname van zijn
      # SQLite-database (WAL) moet het gedeelde -shm-bestand kunnen gebruiken; dat
      # gebeurt als zijn eigen gebruiker (uid 1000), nooit als root (entrypoint.sh).
      - forgejo-data:/forgejo
      # ssh-sleutel + known_hosts voor scp naar een eigen reserveserver (alleen-lezen)
      - ./offsite:/offsite:ro
    entrypoint: ["bash", "/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  redis:
    image: redis:7.4.12-bookworm
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Lokaal taalmodel voor Jarvis/AI (CPU-only; klein model). Draait zelf-gehost,
  # geen externe dienst. Op een kleine VPS kun je deze service weglaten en in
  # plaats daarvan LLM_API_KEY + LLM_BASE_URL (+ AI_ALLOW_REMOTE=true) zetten.
  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    # Met "alles gratis" aan laadt Ollama het taalmodel in het geheugen (gemma3:4b
    # 2,9 GB + granite-embedding 0,6 GB op 7 nov). Begrensd, en als eerste kandidaat
    # voor de OOM-killer: liever het model opnieuw laden dan de database of de app kwijt.
    # Flash attention met een q8-cache halveert het werkgeheugen per gesprek, zodat
    # beide modellen ruimer binnen de grens passen. Warm houden: /api/internal/ai/warm.
    mem_limit: 4g
    oom_score_adj: 500
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks: [internal, bouwer-toegang]

  # Spraakherkenning (faster-whisper "small", meertalig, goed in het Nederlands). Alleen intern
  # bereikbaar (http://whisper:8000/v1). Proef 7 nov: Nederlandse zin vrijwel woordelijk, 8 s de
  # eerste keer (model laden), daarna 2 s; ±750 MB in gebruik. Het model staat in een eigen volume.
  whisper:
    image: fedirz/faster-whisper-server:0.5.0-cpu
    restart: unless-stopped
    mem_limit: 2g
    oom_score_adj: 400
    environment:
      WHISPER__MODEL: Systran/faster-whisper-small
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
    volumes:
      - whisper-models:/root/.cache/huggingface
    networks: [internal]

  # Self-host scheduler: triggert de interne cron-endpoints op schema (zoals
  # Vercel-Cron deed). Zonder deze service draait geen enkele geplande taak.
  cron:
    image: alpine:3.20.10
    restart: unless-stopped
    # alleen wat het rooster nodig heeft, niet heel .env.production (zie caddy)
    environment:
      CRON_TARGET: ${CRON_TARGET:-http://app:3000}
      INTERNAL_CRON_TOKEN: ${INTERNAL_CRON_TOKEN:-}
    volumes:
      - ./deploy/cron/entrypoint.sh:/entrypoint.sh:ro
    command: ["sh", "/entrypoint.sh"]
    depends_on:
      app: { condition: service_started }
    networks: [internal]

  # Roosterplanner met Google OR-Tools (deploy/planner): exacte toewijzing van
  # krachten aan diensten. Optioneel (profiel `planner`, start niet vanzelf):
  #   docker compose … --profile planner up -d --build planner
  # en PLANNER_URL=http://planner:8090 in .env.production. Zonder die dienst
  # rekent de app het rooster zelf uit. Geen geheimen, geen database, intern netwerk.
  planner:
    build:
      context: ./deploy/planner
    image: zekerflex-planner:latest
    restart: unless-stopped
    profiles: [planner]
    networks: [internal]

  # TURN-relay voor gesprekken in de chat, zodat bellen ook achter strenge
  # firewalls werkt. Host-netwerk: ~100 UDP-relaypoorten gaan niet praktisch door
  # Docker's NAT. Alleen deze drie variabelen gaan erin, niet heel .env.production.
  # Zonder TURN_SHARED_SECRET doet de dienst niets. Zie deploy/coturn/entrypoint.sh.
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_REALM: ${TURN_REALM:-zekerflex.com}
      TURN_RELAY_IPS: ${TURN_RELAY_IPS:-}
    volumes:
      - ./deploy/coturn/entrypoint.sh:/zf-turn.sh:ro
    entrypoint: ["sh", "/zf-turn.sh"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Wifi op de werkvloer (lib/netwerk): FreeRADIUS vraagt per inlogpoging de app of
  # iemand nu mag (rooster) en kent de wifi-apparatuur van klanten via dynamic
  # clients. Alleen de eigen sleutel gaat erin. Het certificaat van vps.zekerflex.com
  # komt van Caddy (alleen lezen). Zonder NETWERK_RADIUS_TOKEN slaapt de dienst.
  # Config en uitleg: deploy/netwerk/freeradius.
  freeradius:
    image: freeradius/freeradius-server:3.2.10-alpine
    restart: unless-stopped
    environment:
      NETWERK_RADIUS_TOKEN: ${NETWERK_RADIUS_TOKEN:-}
      RADIUS_CERT_HOST: ${NETWERK_RADIUS_HOST:-vps.zekerflex.com}
    ports:
      - "1812:1812/udp"
    volumes:
      - ./deploy/netwerk/freeradius/clients.conf:/etc/raddb/clients.conf:ro
      - ./deploy/netwerk/freeradius/zf-rest:/etc/raddb/mods-enabled/zf-rest:ro
      - ./deploy/netwerk/freeradius/eap:/etc/raddb/mods-available/eap:ro
      - ./deploy/netwerk/freeradius/default:/etc/raddb/sites-available/default:ro
      - ./deploy/netwerk/freeradius/inner-tunnel:/etc/raddb/sites-available/inner-tunnel:ro
      - ./deploy/netwerk/freeradius/zf-clients:/etc/raddb/sites-enabled/zf-clients:ro
      - ./deploy/netwerk/freeradius/entrypoint.sh:/zf-radius.sh:ro
      - caddy-data:/caddy-data:ro
    entrypoint: ["sh", "/zf-radius.sh"]
    depends_on:
      app: { condition: service_started }
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Veilige werkplek (VPN, lib/netwerk/headscale.ts): Headscale met ingebouwde
  # DERP-relay (STUN op 3490/udp; 3478 en 3479 zijn van coturn). Caddy zet vpn.zekerflex.com
  # door naar poort 8080; de app praat intern via http://headscale:8080 met de
  # API-sleutel HEADSCALE_API_KEY (maken: docker exec zekerflex-headscale-1
  # headscale apikeys create --expiration 3650d). Config: deploy/netwerk/headscale.
  headscale:
    image: headscale/headscale:0.29.7
    restart: unless-stopped
    command: ["serve"]
    ports:
      - "3490:3490/udp"
    volumes:
      - ./deploy/netwerk/headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale-data:/var/lib/headscale
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Aanvalsbescherming (CrowdSec, deploy/crowdsec): leest de toegangslogs van Caddy en
  # het ssh-log van de server, herkent scanners, brute force en bekende aanvallers (ook
  # via de gedeelde blokkadelijst van de community) en bewaart de blokkades. Blokkeren
  # zelf doet de firewall-bouncer op de host (installeer.sh), die ze hier op
  # 127.0.0.1:8085 ophaalt; de app leest ze op het interne netwerk voor Admin →
  # Beveiliging en /beveiliging. De bouncer-sleutels registreert hij bij het starten
  # (naam = wat na BOUNCER_KEY_ staat); zonder sleutels in .env.production praat niemand mee.
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.2
    restart: unless-stopped
    environment:
      TZ: Europe/Amsterdam
      COLLECTIONS: "crowdsecurity/caddy crowdsecurity/sshd crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/whitelist-good-actors"
      PARSERS: "crowdsecurity/geoip-enrich"
      BOUNCER_KEY_zekerflex_app: ${CROWDSEC_BOUNCER_KEY:-}
      BOUNCER_KEY_host_firewall: ${CROWDSEC_HOST_BOUNCER_KEY:-}
    volumes:
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
      - ./deploy/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./deploy/crowdsec/whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/zekerflex-whitelist.yaml:ro
      - caddy-logs:/var/log/caddy:ro
      - /var/log/auth.log:/var/log/auth.log:ro
    ports:
      # alleen voor de firewall-bouncer op de host; van buiten dicht (ufw, en gebonden aan localhost)
      - "127.0.0.1:8085:8080"
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 60s
      timeout: 15s
      retries: 3
    mem_limit: 512m
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # De ZekerFlex Bouwer: AI-programmeur op een eigen kopie van de codebase (Admin →
  # ZekerFlex AI → Bouwer, deploy/bouwer/werker). Geen database en geen app-geheimen:
  # het model en de GitHub-sleutel geeft de app per opdracht mee. Alleen intern
  # bereikbaar, met BOUWER_TOKEN. De code komt via de map-mount, zodat vps-update.sh
  # hem bij een uitrol alleen herstart als die veranderde. Aanzetten (eenmalig):
  # sudo bash deploy/bouwer/installeer-bouwer.sh
  bouwer:
    build:
      context: deploy/bouwer/werker
    image: zekerflex-bouwer:latest
    restart: unless-stopped
    environment:
      BOUWER_TOKEN: ${BOUWER_TOKEN:-}
      # Leestoken voor onze eigen Git-server (deploy/forgejo, gebruiker bouwer-lezen):
      # de code eerst daar ophalen, GitHub als reserve. Nooit naar door de AI gewijzigde
      # code (omgevingZonderSleutel in werkkopie.mjs).
      BOUWER_FORGEJO_TOKEN: ${BOUWER_FORGEJO_TOKEN:-}
      # Leestoken voor GitHub (fine-grained: alleen deze repo, Contents read-only), nodig
      # zodra de repo privé is; zonder: anoniem. Ook gefilterd in omgevingZonderSleutel.
      BOUWER_GITHUB_LEES_TOKEN: ${GITHUB_LEES_TOKEN:-}
      # Live voorbeeld (deploy/bouwer/werker/voorbeeld.mjs): next dev op de werkkopie,
      # met alleen demogegevens in een eigen database, via Caddy op dit adres.
      BOUWER_VOORBEELD_DB: postgresql://voorbeeld:voorbeeld@bouwer-db:5432/voorbeeld
      BOUWER_VOORBEELD_REDIS: redis://bouwer-redis:6379
      BOUWER_VOORBEELD_HOST: ${BOUWER_VOORBEELD_HOST:-voorbeeld.37-97-226-24.sslip.io}
    volumes:
      - ./deploy/bouwer/werker:/opt/bouwer:ro
      - bouwer-werk:/werk
      # de uitrol-vergrendeling: zware stappen wachten tot een uitrol klaar is
      - ./.zf-slot:/zf-slot:ro
    # tsc op de hele codebase vraagt ~2 GB; hier begrensd zodat de app nooit krap komt
    mem_limit: 3g
    cpus: 2
    depends_on:
      bouwer-db: { condition: service_started }
      bouwer-redis: { condition: service_started }
    networks: [bouwer-toegang, bouwer]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Wegwerp-database voor het live voorbeeld van de Bouwer: alleen demogegevens,
  # los van de echte database, op een eigen netwerk zonder internet. Het vaste
  # wachtwoord is bewust: niets anders dan de Bouwer kan erbij.
  bouwer-db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: voorbeeld
      POSTGRES_PASSWORD: voorbeeld
      POSTGRES_DB: voorbeeld
    volumes:
      - bouwer-db:/var/lib/postgresql
    mem_limit: 512m
    networks: [bouwer]

  bouwer-redis:
    image: redis:7.4.12-bookworm
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    mem_limit: 128m
    networks: [bouwer]

  # Android-bouwer: bouwt de Android-app (.aab) van een rijschool (deploy/android-bouwer,
  # lib/rijschool/app). Geen database en geen geheimen: de uploadsleutel geeft de app
  # per opdracht mee. Alleen intern bereikbaar, met ANDROID_BOUWER_TOKEN. De code komt
  # via een map-mount; Gradle en de Android-SDK zitten in de image (opgewarmd).
  # Aanzetten (eenmalig): sudo bash deploy/android-bouwer/installeer.sh
  android-bouwer:
    build:
      context: deploy/android-bouwer
    image: zekerflex-android-bouwer:latest
    restart: unless-stopped
    environment:
      ANDROID_BOUWER_TOKEN: ${ANDROID_BOUWER_TOKEN:-}
    volumes:
      - ./deploy/android-bouwer:/opt/android-bouwer/code:ro
      - android-bouwer-werk:/werk
      # Gradle-cache: de eerste keer gevuld uit de image, daarna blijft hij staan
      - android-bouwer-gradle:/opt/gradle
      # de uitrol-vergrendeling: gradle wacht tot een uitrol klaar is
      - ./.zf-slot:/zf-slot:ro
    # gradle krijgt -Xmx1536m (gradle.properties van Bubblewrap); één bouw tegelijk
    mem_limit: 2560m
    cpus: 2
    # niet op internal: een bouw met code van derden (gradle) kan zo niet bij de echte database of Redis
    networks: [bouwer-toegang]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Rapportages (lib/bi): Metabase, open source, op de eigen server. Zijn eigen
  # gegevens staan in de database `metabase` op onze Postgres (de app maakt die aan);
  # onze cijfers leest hij als rol zf_bi, alleen in het schema bi (lib/bi/views.ts).
  # Alleen via Caddy bereikbaar op METABASE_HOST (standaard een sslip.io-naam, geen
  # DNS nodig; zet METABASE_HOST=bi.zekerflex.com zodra de A-record staat).
  # De Java-VM krijgt 1 GB; de container 1,5 GB.
  metabase:
    image: metabase/metabase:v0.56.6
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: zekerflex
      MB_DB_PASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      MB_SITE_URL: https://${METABASE_HOST:-bi.37-97-226-24.sslip.io}
      MB_SITE_LOCALE: nl
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      MB_EMBEDDING_APP_ORIGIN: ${APP_BASE_URL:-https://zekerflex.com}
      JAVA_OPTS: -Xmx1g -XX:+UseSerialGC
      JAVA_TIMEZONE: Europe/Amsterdam
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # Kennisbank (lib/kennisbank): Outline, open source, op de eigen server, met
  # "Inloggen met ZekerFlex" (OpenID Connect, lib/oidc). Eigen database `outline`
  # op onze Postgres (deploy/scripts/databases-aanmaken.sh), Redis gedeeld (db 2),
  # bijlagen op een eigen volume. De geheimen maakt de uitrol zelf aan
  # (env-aanvullen.sh). Alleen via Caddy bereikbaar op OUTLINE_HOST.
  outline:
    image: outlinewiki/outline:0.86.1
    restart: unless-stopped
    command: ["sh", "-c", "yarn db:migrate --env=production-ssl-disabled && yarn start"]
    environment:
      NODE_ENV: production
      SECRET_KEY: ${OUTLINE_SECRET_KEY:-}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET:-}
      DATABASE_URL: postgres://zekerflex:${POSTGRES_PASSWORD}@postgres:5432/outline
      PGSSLMODE: disable
      REDIS_URL: redis://redis:6379/2
      URL: https://${OUTLINE_HOST:-kennis.37-97-226-24.sslip.io}
      PORT: 3000
      FORCE_HTTPS: "false"
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE_UPLOAD_MAX_SIZE: "26214400"
      DEFAULT_LANGUAGE: nl_NL
      WEB_CONCURRENCY: "1"
      ENABLE_UPDATES: "false"
      TELEMETRY: "false"
      OIDC_CLIENT_ID: outline
      OIDC_CLIENT_SECRET: ${OIDC_OUTLINE_SECRET:-}
      OIDC_AUTH_URI: ${APP_BASE_URL:-https://zekerflex.com}/api/oidc/authorize
      OIDC_TOKEN_URI: ${APP_BASE_URL:-https://zekerflex.com}/api/oidc/token
      OIDC_USERINFO_URI: ${APP_BASE_URL:-https://zekerflex.com}/api/oidc/userinfo
      OIDC_DISPLAY_NAME: ZekerFlex
      OIDC_SCOPES: openid profile email
      OIDC_USERNAME_CLAIM: preferred_username
    volumes:
      - outline-data:/var/lib/outline/data
    mem_limit: 768m
    cpus: 1
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # Browser-werker voor de bronnen (lib/bronnen, deploy/scraper): Playwright met
  # Chromium in een eigen container. Geen database en geen geheimen van de app;
  # alleen de app praat ermee (SCRAPER_TOKEN, door de uitrol zelf aangemaakt) op een
  # eigen netwerk, zodat een pagina van buiten nooit bij Postgres of Redis kan.
  scraper:
    build:
      context: deploy/scraper
    image: zekerflex-scraper:latest
    restart: unless-stopped
    init: true
    environment:
      SCRAPER_TOKEN: ${SCRAPER_TOKEN:-}
    mem_limit: 1g
    cpus: 1
    shm_size: 512m
    networks: [bronnen]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Eigen Git-server: Forgejo, een "eigen GitHub" (gratis, open source; lib/gratis/
  # diensten.ts → code). Fase 1: een spiegel van de GitHub-repo die elke 10 minuten
  # bijwerkt, zodat de code ook op onze eigen server staat; inrichten met
  # deploy/forgejo/inrichten.sh. Registreren staat uit en alles is alleen zichtbaar na
  # inloggen. SQLite in het eigen volume (geen extra database), geen SSH naar buiten
  # (git gaat via https), geen Actions. Eigen netwerk "git" met alleen Caddy erbij:
  # een openbare inlogpagina hoort niet naast Postgres en Redis.
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__ROOT_URL: https://${FORGEJO_HOST:-git.37-97-226-24.sslip.io}/
      FORGEJO__server__DOMAIN: ${FORGEJO_HOST:-git.37-97-226-24.sslip.io}
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__OFFLINE_MODE: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNUP: "false"
      FORGEJO__repository__DEFAULT_PRIVATE: private
      FORGEJO__mirror__DEFAULT_INTERVAL: 10m
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__log__LEVEL: Warn
    volumes:
      - forgejo-data:/data
    mem_limit: 512m
    cpus: 1
    networks: [git]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  internal:
    driver: bridge
  # de app en de browser-werker; de werker zit bewust niet op internal
  bronnen:
    driver: bridge
  # alleen de Bouwer en zijn voorbeeld-database/-redis; geen internet
  bouwer:
    driver: bridge
    internal: true
  # Wie met de Bouwer praat: de app, Caddy (voorbeeld) en het taalmodel. De Bouwer zit
  # NIET op internal: door de AI gewijzigde code (voorbeeld, tests) en de terminal
  # kunnen zo niet bij de echte database of Redis (die heeft geen wachtwoord).
  bouwer-toegang:
    driver: bridge
  # Forgejo (eigen Git-server) en Caddy; met internet voor de spiegel, zonder Postgres/Redis
  git:
    driver: bridge

volumes:
  forgejo-data:
  outline-data:
  app-storage:
  site-backups:
  next-cache:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:
  caddy-logs:
  crowdsec-config:
  crowdsec-data:
  ollama-models:
  whisper-models:
  bouwer-werk:
  bouwer-db:
  android-bouwer-werk:
  headscale-data:
  android-bouwer-gradle:
