# ZekerFlex Sovereign Box — productie-stack voor een VPS met EIGEN PUBLIEK IP
# (TransIP, Hetzner, …). Dit is de variant van docker-compose.prod.yml zonder
# Cloudflare-tunnel: verkeer komt rechtstreeks binnen via Caddy op poort 80/443.
# Gebruik dit wanneer je domein-DNS NIET bij Cloudflare staat (zoals bij TransIP).
#
#   cp deploy/.env.production.example .env.production   # of laat deploy-vps.sh 'm genereren
#   docker compose --env-file .env.production -f docker-compose.vps.yml up -d --build
#
# Inbound poorten: 80 + 443 (Caddy), en voor bellen 3478/udp+tcp en 49160:49260/udp
# (coturn). Houd de rest van de firewall dicht, op SSH na.
# TLS: zet SITE_ADDRESS in .env.production op je domein zodra de A-record naar
# deze VPS wijst; Caddy haalt dan automatisch een Let's Encrypt-certificaat op.
#
# Zware AI-diensten (ollama/whisper/sd) zitten hier bewust NIET in: op een CPU-
# only VPS draaien die slecht. De app valt terug op sjablonen, of je zet een
# externe LLM aan via LLM_API_KEY + LLM_BASE_URL in .env.production.
#
# Dit bestand migreert of seedt de database nooit. Zie deploy/README.md.

name: zekerflex

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Vaste sleutel voor server-acties (zie Dockerfile): open formulieren overleven een uitrol.
      args:
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    image: zekerflex-app:latest
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://zekerflex:${POSTGRES_PASSWORD}@postgres:5432/zekerflex?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Lokaal taalmodel (Ollama) zodat Jarvis/AI werkt zonder externe dienst.
      # Klein model i.v.m. CPU-only VPS; vervang door LLM_API_KEY/LLM_BASE_URL in
      # .env.production voor een sneller extern model.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-qwen2.5:3b}
      # ZekerFlex Kaart leest zijn data alleen via deze variabele (zie app/kaart-data)
      KAART_DATA_DIR: /app/kaart-data
    volumes:
      - app-storage:/app/storage
      # Back-ups van beheerde klantsites: eigen volume, niet in onze eigen nachtelijke back-up.
      - site-backups:/app/site-backups
      # Omgezette foto's van next/image: blijven bewaard bij een deploy.
      - next-cache:/app/.next/cache
      # Alleen-lezen: de app controleert de nachtelijke back-up (lib/ops/backup.ts).
      - ./backups:/backups:ro
      # Alleen-lezen: kaartdata van ZekerFlex Kaart (tegels NL, lettertypes), niet in git;
      # ophalen/bijwerken met deploy/kaart/haal-kaart.sh, geserveerd door app/kaart-data.
      - ./kaart-data:/app/kaart-data:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal, bouwer-toegang]
    # Geen `ports:` — alles loopt via Caddy.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Alleen wat de Caddyfile leest, niet heel .env.production: anders maakt elke
    # nieuwe sleutel daarin (van welke functie ook) Caddy bij de volgende uitrol
    # opnieuw aan, en is de hele site even weg (4 nov: inloggen gaf de foutpagina).
    # Caddy hoeft ook geen geheimen van de app te kennen. Standaard = die in de Caddyfile.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      BOUWER_VOORBEELD_HOST: ${BOUWER_VOORBEELD_HOST:-voorbeeld.37-97-226-24.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # De map, niet het bestand: tar vervangt de Caddyfile bij elke uitrol (nieuwe
      # inode), en via de map ziet de draaiende caddy die meteen, zodat
      # vps-update.sh hem zonder onderbreking kan herladen.
      - ./deploy/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: { condition: service_started }
    networks: [internal, bouwer-toegang]

  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: zekerflex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: zekerflex
    volumes:
      # Postgres 18+ image wil één mount op /var/lib/postgresql (data komt in een
      # versie-submap); /var/lib/postgresql/data zoals bij <=16 laat 18 crashen.
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zekerflex -d zekerflex"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Nachtelijke back-up van de database + uploads, met proef-terugzetting in een
  # wegwerp-database en elke zondag een diepgaande hersteltest (tabel voor tabel
  # vergeleken met het moment van de back-up). Met BACKUP_PASSPHRASE komt er een
  # versleutelde kopie bij, met BACKUP_OFFSITE gaat die naar een plek buiten de
  # server (scp of WebDAV). Schrijft naar ./backups; de nieuwste 14 blijven staan.
  # Zie deploy/backup/entrypoint.sh en deploy/DISASTER-RECOVERY.md.
  backup:
    build:
      context: deploy/backup
    image: zekerflex-backup:latest
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: zekerflex
      PGDATABASE: zekerflex
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      # eigenaar van de back-upbestanden op de host (de deploy-gebruiker), zodat
      # ze zonder sudo naar een andere computer gekopieerd kunnen worden
      BACKUP_UID: ${BACKUP_UID:-1000}
      # wachtwoordzin voor de versleutelde kopie (.enc); bewaar hem óók buiten de server,
      # want zonder is de kopie waardeloos. Leeg = geen versleutelde kopie.
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      # kopie buiten de server: scp://gebruiker@host/pad (sleutel in ./offsite/id_ed25519 +
      # known_hosts) of https://host/webdav/pad/ met BACKUP_OFFSITE_USER/PASS. Leeg = uit.
      BACKUP_OFFSITE: ${BACKUP_OFFSITE:-}
      BACKUP_OFFSITE_USER: ${BACKUP_OFFSITE_USER:-}
      BACKUP_OFFSITE_PASS: ${BACKUP_OFFSITE_PASS:-}
    volumes:
      - ./deploy/backup/entrypoint.sh:/backup.sh:ro
      - ./backups:/backups
      - app-storage:/storage:ro
      # ssh-sleutel + known_hosts voor scp naar een eigen reserveserver (alleen-lezen)
      - ./offsite:/offsite:ro
    entrypoint: ["bash", "/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Lokaal taalmodel voor Jarvis/AI (CPU-only; klein model). Draait zelf-gehost,
  # geen externe dienst. Op een kleine VPS kun je deze service weglaten en in
  # plaats daarvan LLM_API_KEY + LLM_BASE_URL (+ AI_ALLOW_REMOTE=true) zetten.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks: [internal, bouwer-toegang]

  # Self-host scheduler: triggert de interne cron-endpoints op schema (zoals
  # Vercel-Cron deed). Zonder deze service draait geen enkele geplande taak.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      CRON_TARGET: ${CRON_TARGET:-http://app:3000}
    volumes:
      - ./deploy/cron/entrypoint.sh:/entrypoint.sh:ro
    command: ["sh", "/entrypoint.sh"]
    depends_on:
      app: { condition: service_started }
    networks: [internal]

  # TURN-relay voor gesprekken in de chat, zodat bellen ook achter strenge
  # firewalls werkt. Host-netwerk: ~100 UDP-relaypoorten gaan niet praktisch door
  # Docker's NAT. Alleen deze drie variabelen gaan erin, niet heel .env.production.
  # Zonder TURN_SHARED_SECRET doet de dienst niets. Zie deploy/coturn/entrypoint.sh.
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_REALM: ${TURN_REALM:-zekerflex.com}
      TURN_RELAY_IPS: ${TURN_RELAY_IPS:-}
    volumes:
      - ./deploy/coturn/entrypoint.sh:/zf-turn.sh:ro
    entrypoint: ["sh", "/zf-turn.sh"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Wifi op de werkvloer (lib/netwerk): FreeRADIUS vraagt per inlogpoging de app of
  # iemand nu mag (rooster) en kent de wifi-apparatuur van klanten via dynamic
  # clients. Alleen de eigen sleutel gaat erin. Het certificaat van vps.zekerflex.com
  # komt van Caddy (alleen lezen). Zonder NETWERK_RADIUS_TOKEN slaapt de dienst.
  # Config en uitleg: deploy/netwerk/freeradius.
  freeradius:
    image: freeradius/freeradius-server:3.2.10-alpine
    restart: unless-stopped
    environment:
      NETWERK_RADIUS_TOKEN: ${NETWERK_RADIUS_TOKEN:-}
      RADIUS_CERT_HOST: ${NETWERK_RADIUS_HOST:-vps.zekerflex.com}
    ports:
      - "1812:1812/udp"
    volumes:
      - ./deploy/netwerk/freeradius/clients.conf:/etc/raddb/clients.conf:ro
      - ./deploy/netwerk/freeradius/zf-rest:/etc/raddb/mods-enabled/zf-rest:ro
      - ./deploy/netwerk/freeradius/eap:/etc/raddb/mods-available/eap:ro
      - ./deploy/netwerk/freeradius/default:/etc/raddb/sites-available/default:ro
      - ./deploy/netwerk/freeradius/inner-tunnel:/etc/raddb/sites-available/inner-tunnel:ro
      - ./deploy/netwerk/freeradius/zf-clients:/etc/raddb/sites-enabled/zf-clients:ro
      - ./deploy/netwerk/freeradius/entrypoint.sh:/zf-radius.sh:ro
      - caddy-data:/caddy-data:ro
    entrypoint: ["sh", "/zf-radius.sh"]
    depends_on:
      app: { condition: service_started }
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Veilige werkplek (VPN, lib/netwerk/headscale.ts): Headscale met ingebouwde
  # DERP-relay (STUN op 3479/udp; 3478 is van coturn). Caddy zet vpn.zekerflex.com
  # door naar poort 8080; de app praat intern via http://headscale:8080 met de
  # API-sleutel HEADSCALE_API_KEY (maken: docker exec zekerflex-headscale-1
  # headscale apikeys create --expiration 3650d). Config: deploy/netwerk/headscale.
  headscale:
    image: headscale/headscale:0.29.7
    restart: unless-stopped
    command: ["serve"]
    ports:
      - "3479:3479/udp"
    volumes:
      - ./deploy/netwerk/headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale-data:/var/lib/headscale
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # De ZekerFlex Bouwer: AI-programmeur op een eigen kopie van de codebase (Admin →
  # ZekerFlex AI → Bouwer, deploy/bouwer/werker). Geen database en geen app-geheimen:
  # het model en de GitHub-sleutel geeft de app per opdracht mee. Alleen intern
  # bereikbaar, met BOUWER_TOKEN. De code komt via de map-mount, zodat vps-update.sh
  # hem bij een uitrol alleen herstart als die veranderde. Aanzetten (eenmalig):
  # sudo bash deploy/bouwer/installeer-bouwer.sh
  bouwer:
    build:
      context: deploy/bouwer/werker
    image: zekerflex-bouwer:latest
    restart: unless-stopped
    environment:
      BOUWER_TOKEN: ${BOUWER_TOKEN:-}
      # Live voorbeeld (deploy/bouwer/werker/voorbeeld.mjs): next dev op de werkkopie,
      # met alleen demogegevens in een eigen database, via Caddy op dit adres.
      BOUWER_VOORBEELD_DB: postgresql://voorbeeld:voorbeeld@bouwer-db:5432/voorbeeld
      BOUWER_VOORBEELD_REDIS: redis://bouwer-redis:6379
      BOUWER_VOORBEELD_HOST: ${BOUWER_VOORBEELD_HOST:-voorbeeld.37-97-226-24.sslip.io}
    volumes:
      - ./deploy/bouwer/werker:/opt/bouwer:ro
      - bouwer-werk:/werk
      # de uitrol-vergrendeling: zware stappen wachten tot een uitrol klaar is
      - ./.zf-slot:/zf-slot:ro
    # tsc op de hele codebase vraagt ~2 GB; hier begrensd zodat de app nooit krap komt
    mem_limit: 3g
    cpus: 2
    depends_on:
      bouwer-db: { condition: service_started }
      bouwer-redis: { condition: service_started }
    networks: [bouwer-toegang, bouwer]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Wegwerp-database voor het live voorbeeld van de Bouwer: alleen demogegevens,
  # los van de echte database, op een eigen netwerk zonder internet. Het vaste
  # wachtwoord is bewust: niets anders dan de Bouwer kan erbij.
  bouwer-db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: voorbeeld
      POSTGRES_PASSWORD: voorbeeld
      POSTGRES_DB: voorbeeld
    volumes:
      - bouwer-db:/var/lib/postgresql
    mem_limit: 512m
    networks: [bouwer]

  bouwer-redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    mem_limit: 128m
    networks: [bouwer]

  # Android-bouwer: bouwt de Android-app (.aab) van een rijschool (deploy/android-bouwer,
  # lib/rijschool/app). Geen database en geen geheimen: de uploadsleutel geeft de app
  # per opdracht mee. Alleen intern bereikbaar, met ANDROID_BOUWER_TOKEN. De code komt
  # via een map-mount; Gradle en de Android-SDK zitten in de image (opgewarmd).
  # Aanzetten (eenmalig): sudo bash deploy/android-bouwer/installeer.sh
  android-bouwer:
    build:
      context: deploy/android-bouwer
    image: zekerflex-android-bouwer:latest
    restart: unless-stopped
    environment:
      ANDROID_BOUWER_TOKEN: ${ANDROID_BOUWER_TOKEN:-}
    volumes:
      - ./deploy/android-bouwer:/opt/android-bouwer/code:ro
      - android-bouwer-werk:/werk
      # Gradle-cache: de eerste keer gevuld uit de image, daarna blijft hij staan
      - android-bouwer-gradle:/opt/gradle
      # de uitrol-vergrendeling: gradle wacht tot een uitrol klaar is
      - ./.zf-slot:/zf-slot:ro
    # gradle krijgt -Xmx1536m (gradle.properties van Bubblewrap); één bouw tegelijk
    mem_limit: 2560m
    cpus: 2
    # niet op internal: een bouw met code van derden (gradle) kan zo niet bij de echte database of Redis
    networks: [bouwer-toegang]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  internal:
    driver: bridge
  # alleen de Bouwer en zijn voorbeeld-database/-redis; geen internet
  bouwer:
    driver: bridge
    internal: true
  # Wie met de Bouwer praat: de app, Caddy (voorbeeld) en het taalmodel. De Bouwer zit
  # NIET op internal: door de AI gewijzigde code (voorbeeld, tests) en de terminal
  # kunnen zo niet bij de echte database of Redis (die heeft geen wachtwoord).
  bouwer-toegang:
    driver: bridge

volumes:
  app-storage:
  site-backups:
  next-cache:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:
  ollama-models:
  bouwer-werk:
  bouwer-db:
  android-bouwer-werk:
  headscale-data:
  android-bouwer-gradle:
