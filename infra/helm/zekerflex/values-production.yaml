# helm upgrade --install zekerflex ./infra/helm/zekerflex \
#   -n zekerflex --create-namespace \
#   -f infra/helm/zekerflex/values-production.yaml \
#   --set image.tag=$GIT_SHA --set existingSecret=zekerflex-secrets

replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70

pdb:
  minAvailable: 2

persistence:
  accessMode: ReadWriteMany
  storageClass: efs-sc
  size: 20Gi

existingSecret: zekerflex-secrets

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: zekerflex
