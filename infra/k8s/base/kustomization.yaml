apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zekerflex

labels:
  - pairs:
      app.kubernetes.io/part-of: zekerflex
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.example.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

images:
  - name: ghcr.io/zekerflex/zekerflex-app
    newTag: latest
