apiVersion: apps/v1
kind: Deployment
metadata:
  name: zekerflex-app
  labels:
    app.kubernetes.io/name: zekerflex
    app.kubernetes.io/component: web
spec:
  # Base runs a single replica because the filesystem stores under /app/storage
  # (prefs, fiscal, payroll, mailbox, learn) use a ReadWriteOnce PVC. For HA,
  # the production overlay swaps in a ReadWriteMany class (EFS/Filestore) and
  # raises the replica count.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: zekerflex
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zekerflex
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: zekerflex
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/zekerflex/zekerflex-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: zekerflex-config
            - secretRef:
                name: zekerflex-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
            - name: storage
              mountPath: /app/storage
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
        - name: storage
          persistentVolumeClaim:
            claimName: zekerflex-storage
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: zekerflex
              app.kubernetes.io/component: web
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zekerflex-storage
  labels:
    app.kubernetes.io/name: zekerflex
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
