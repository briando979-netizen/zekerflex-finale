# Default-deny ingress; allow only the ingress controller. Egress open (the app
# needs Postgres, Redis, Ollama, SMTP, and outbound HTTPS to KVKBase/Didit).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zekerflex-default-deny
  labels:
    app.kubernetes.io/name: zekerflex
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zekerflex-allow-ingress-controller
  labels:
    app.kubernetes.io/name: zekerflex
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zekerflex
      app.kubernetes.io/component: web
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: http
          protocol: TCP
