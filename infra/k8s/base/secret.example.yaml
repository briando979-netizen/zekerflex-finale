# DO NOT COMMIT REAL VALUES. Create the real Secret with one of:
#   kubectl -n zekerflex create secret generic zekerflex-secrets \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=AUTH_SECRET="$(openssl rand -base64 48)" \
#     ...
#   or seal it with Bitnami sealed-secrets / external-secrets (recommended).
apiVersion: v1
kind: Secret
metadata:
  name: zekerflex-secrets
  labels:
    app.kubernetes.io/name: zekerflex
type: Opaque
stringData:
  DATABASE_URL: "postgresql://zekerflex:CHANGE_ME@zekerflex-postgres:5432/zekerflex?schema=public"
  AUTH_SECRET: "CHANGE_ME_min_32_chars_generate_with_openssl_rand"
  INTERNAL_CRON_TOKEN: "CHANGE_ME"
  WEBPUSH_VAPID_PUBLIC_KEY: "CHANGE_ME"
  WEBPUSH_VAPID_PRIVATE_KEY: "CHANGE_ME"
  WEBPUSH_CONTACT: "mailto:ops@zekerflex.com"
  KVKBASE_API_KEY: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  SMTP_USER: ""
  SMTP_PASS: ""
