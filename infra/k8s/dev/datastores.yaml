# LOCAL / kind ONLY — single-replica Postgres + Redis + Ollama stub so the Helm
# chart can be exercised end-to-end without managed services.
# PRODUCTION uses external/managed Postgres + Redis (see values-production.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: zekerflex-secrets
  namespace: zekerflex
type: Opaque
stringData:
  DATABASE_URL: "postgresql://zekerflex:zekerflex@postgres:5432/zekerflex?schema=public"
  AUTH_SECRET: "local_kind_auth_secret_at_least_32_characters_long"
  INTERNAL_CRON_TOKEN: "local_kind_cron_token"
  WEBPUSH_VAPID_PUBLIC_KEY: "BJhOZ5m1local_placeholder_public_key_value_padding_padding_padding_padding_paddingXX"
  WEBPUSH_VAPID_PRIVATE_KEY: "local_placeholder_private_key_value_xxxxxxxxx"
  WEBPUSH_CONTACT: "mailto:ops@zekerflex.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: zekerflex
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: zekerflex }
            - { name: POSTGRES_PASSWORD, value: zekerflex }
            - { name: POSTGRES_DB, value: zekerflex }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "zekerflex"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: zekerflex }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zekerflex-redis
  namespace: zekerflex
spec:
  replicas: 1
  selector: { matchLabels: { app: zekerflex-redis } }
  template:
    metadata: { labels: { app: zekerflex-redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: zekerflex-redis, namespace: zekerflex }
spec:
  selector: { app: zekerflex-redis }
  ports: [{ port: 6379, targetPort: 6379 }]
