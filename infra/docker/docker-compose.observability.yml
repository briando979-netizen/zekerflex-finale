# Optional observability sidecars for the single-VPS deployment. Compose them
# alongside the main stack:
#
#   docker compose -f docker-compose.prod.yml \
#     -f infra/docker/docker-compose.observability.yml up -d
#
# Nothing here is exposed to the internet — reach Grafana over the Cloudflare
# Tunnel or an SSH port-forward.
name: zekerflex

services:
  # Scrapes the app's /api/metrics-style endpoints and node/cadvisor.
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - ./prometheus.token:/etc/prometheus/token:ro
      - prom-data:/prometheus
    networks: [internal]

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.zekerflex.com
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [internal]

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave
    networks: [internal]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [internal]

  # Ships container logs to Loki (query in Grafana).
  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks: [internal]

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

  # GlitchTip: open-source, Sentry-compatibele foutopsporing in eigen beheer.
  # De app stuurt elke nieuwe soort fout uit het eigen foutenlogboek erheen
  # (lib/ops/glitchtip.ts) zodra GLITCHTIP_DSN in .env.production staat.
  # Eerste keer: `docker compose … exec glitchtip ./manage.py createsuperuser`,
  # dan in GlitchTip een project maken en de DSN overnemen. Alleen intern
  # bereikbaar (poort 8000 op het netwerk); naar buiten via SSH-tunnel of een
  # eigen Caddy-regel met basisauthenticatie.
  # Eigen profiel: zet eerst GLITCHTIP_DB_PASSWORD en GLITCHTIP_SECRET_KEY en start
  # met `--profile glitchtip`; zonder die variabelen starten Prometheus, Grafana en
  # Loki gewoon zoals voorheen.
  glitchtip-db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: [glitchtip]
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-}
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip-db:/var/lib/postgresql/data
    networks: [internal]

  glitchtip:
    image: glitchtip/glitchtip:v5
    restart: unless-stopped
    profiles: [glitchtip]
    depends_on: [glitchtip-db]
    environment: &glitchtip-env
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/glitchtip
      REDIS_URL: redis://redis:6379/3
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-https://fouten.zekerflex.com}
      DEFAULT_FROM_EMAIL: ${MAIL_FROM:-noreply@zekerflex.com}
      ENABLE_OPEN_USER_REGISTRATION: "False"
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: "90"
    volumes:
      - glitchtip-uploads:/code/uploads
    networks: [internal]

  glitchtip-worker:
    image: glitchtip/glitchtip:v5
    restart: unless-stopped
    profiles: [glitchtip]
    command: ./bin/run-celery-with-beat.sh
    depends_on: [glitchtip-db]
    environment: *glitchtip-env
    volumes:
      - glitchtip-uploads:/code/uploads
    networks: [internal]

volumes:
  prom-data:
  grafana-data:
  loki-data:
  glitchtip-db:
  glitchtip-uploads:

networks:
  internal:
    external: true
    name: zekerflex_internal
