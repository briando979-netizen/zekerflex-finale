name: Terraform

on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/terraform/**"]
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply (production)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write      # OIDC to assume the AWS deploy role
  pull-requests: write # post the plan as a PR comment

env:
  TF_DIR: infra/terraform
  AWS_REGION: eu-central-1
  TF_VERSION: 1.9.5

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: fmt
        run: terraform -chdir=$TF_DIR fmt -check -recursive

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: init
        run: |
          terraform -chdir=$TF_DIR init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: validate
        run: terraform -chdir=$TF_DIR validate

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
      - run: cd $TF_DIR && tflint --init && tflint --recursive

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: true

      - name: plan
        id: plan
        run: |
          terraform -chdir=$TF_DIR plan -no-color -input=false \
            -var-file=env/production.tfvars -out=tfplan | tee plan.txt
        env:
          TF_VAR_cloudflare_tunnel_token: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

      - name: comment plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "```\n" + plan + "\n```",
            });

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/terraform/tfplan

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.apply)
    runs-on: ubuntu-latest
    environment: production   # requires manual approval
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: init
        run: |
          terraform -chdir=$TF_DIR init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"
      - name: apply
        run: terraform -chdir=$TF_DIR apply -input=false -auto-approve -var-file=env/production.tfvars
        env:
          TF_VAR_cloudflare_tunnel_token: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
