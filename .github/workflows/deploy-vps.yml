name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/zekerflex
            git fetch origin
            git checkout main
            git pull origin main
            nohup bash deploy/scripts/vps-update.sh > /tmp/zf-deploy.log 2>&1 &
            echo "Deployment started on VPS"

      - name: Notify deployment
        if: always()
        run: echo "Deployment to VPS complete - check VPS logs for details"
