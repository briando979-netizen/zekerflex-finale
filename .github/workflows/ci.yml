# Every push and pull request: typecheck, unit tests, and the critical
# browser journeys (sign-up → e-mail code → verification, reacting to a klus,
# hours → invoices) against a fresh Postgres + Redis.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://zekerflex:zekerflex@localhost:5432/zekerflex?schema=public
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p .
      - run: npx vitest run

  e2e:
    name: Browser tests (critical journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zekerflex
          POSTGRES_PASSWORD: zekerflex
          POSTGRES_DB: zekerflex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zekerflex" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://zekerflex:zekerflex@localhost:5432/zekerflex?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0000
      AUTH_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: npx next build
      - name: Start server
        run: |
          npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:3000/api/health
      - name: Browser tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test e2e/flows.spec.ts e2e/critical-path.spec.ts
      - name: Server log on failure
        if: failure()
        run: tail -200 server.log || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
