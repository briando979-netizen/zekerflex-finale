apiVersion: apps/v1
kind: Deployment
metadata:
  name: zekerflex-app
  namespace: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: zekerflex-app
  template:
    metadata:
      labels:
        app: zekerflex-app
    spec:
      containers:
      - name: app
        image: zekerflex:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
        - name: NEXTAUTH_URL
          value: "https://zekerflex.com"
---
apiVersion: v1
kind: Service
metadata:
  name: zekerflex-service
  namespace: production
spec:
  type: LoadBalancer
  selector:
    app: zekerflex-app
  ports:
  - protocol: TCP
    port: 443
    targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zekerflex-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zekerflex-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
