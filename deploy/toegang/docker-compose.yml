# Het kastje bij de slagboom (deploy/toegang) als container op een mini-pc.
#   cp .env.example .env   → invullen   → docker compose up -d --build
services:
  toegang:
    build: .
    restart: unless-stopped
    env_file: .env
    # usb-camera of usb-relais doorgeven:
    # devices:
    #   - /dev/video0:/dev/video0
    network_mode: host
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
