<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>FlikFlak — beheer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #0b0b0f; color: #eee; }
    header { padding: 14px 18px; background: #15151c; border-bottom: 1px solid #262633; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header b { font-size: 17px; }
    main { padding: 18px; max-width: 980px; margin: 0 auto; }
    .login { max-width: 360px; margin: 10vh auto; background: #15151c; padding: 24px; border-radius: 14px; }
    input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #333; background: #0b0b0f; color: #eee; font-size: 15px; }
    button { cursor: pointer; border: 0; border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 600; background: #ff7a1a; color: #1a1206; }
    button.grey { background: #2a2a36; color: #ddd; }
    button.red { background: #3a1414; color: #ff9a9a; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 22px; }
    .kpi { background: #15151c; border: 1px solid #23232e; border-radius: 12px; padding: 12px 14px; }
    .kpi .n { font-size: 22px; font-weight: 700; }
    .kpi .l { color: #9a9aad; font-size: 13px; }
    h2 { font-size: 16px; margin: 26px 0 10px; }
    .row { display: flex; gap: 12px; align-items: center; background: #15151c; border: 1px solid #23232e; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
    .row.open { border-color: #6a4a1a; }
    .row img, .row .noimg { width: 54px; height: 72px; border-radius: 8px; object-fit: cover; background: #222; flex: 0 0 auto; }
    .row .m { flex: 1 1 auto; min-width: 0; }
    .row .m .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .m .s { color: #9a9aad; font-size: 13px; }
    .ip { font-family: ui-monospace, monospace; color: #8aa; font-size: 12px; }
    .actions { display: flex; gap: 6px; flex: 0 0 auto; }
    .muted { color: #9a9aad; }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
    .tabs button { background: #2a2a36; color: #ddd; }
    .tabs button.on { background: #ff7a1a; color: #1a1206; }
    .err { color: #ff9a9a; margin-top: 8px; min-height: 18px; }
  </style>
</head>
<body>
  <div id="login" class="login">
    <b>FlikFlak — beheer</b>
    <p class="muted">Vul het beheer-token in.</p>
    <input id="token" type="password" placeholder="Beheer-token" autocomplete="off">
    <div class="err" id="loginErr"></div>
    <button style="width:100%;margin-top:10px" onclick="start()">Openen</button>
  </div>

  <div id="app" hidden>
    <header><b>FlikFlak — beheer</b><span class="muted" id="who"></span><button class="grey" style="margin-left:auto" onclick="uit()">Afmelden</button></header>
    <main>
      <div class="kpis" id="kpis"></div>
      <div class="tabs">
        <button data-t="reports" class="on" onclick="tab('reports')">Meldingen</button>
        <button data-t="videos" onclick="tab('videos')">Video's</button>
        <button data-t="users" onclick="tab('users')">Accounts</button>
        <button data-t="dash" onclick="tab('dash')">Dashboard</button>
        <button data-t="aank" onclick="tab('aank')">Aankondiging</button>
        <button data-t="woorden" onclick="tab('woorden')">Woordenlijst</button>
      </div>
      <div id="list"></div>
    </main>
  </div>

  <script>
    let TOKEN = sessionStorage.getItem('ff_admin') || '';
    let DATA = null, T = 'reports';
    const $ = s => document.querySelector(s);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const when = t => t ? new Date(t).toLocaleString('nl-NL') : '—';

    async function api(method, path) {
      const r = await fetch('/api/admin' + path, { method, headers: { 'x-admin': TOKEN } });
      if (r.status === 401) throw new Error('Geen toegang — token klopt niet');
      return r.json();
    }
    async function start() {
      TOKEN = $('#token').value.trim() || TOKEN;
      try {
        DATA = await api('GET', '/overzicht');
        sessionStorage.setItem('ff_admin', TOKEN);
        $('#login').hidden = true; $('#app').hidden = false;
        render();
      } catch (e) { $('#loginErr').textContent = e.message; }
    }
    function uit() { sessionStorage.removeItem('ff_admin'); location.reload(); }
    async function herlaad() { DATA = await api('GET', '/overzicht'); render(); }
    function tab(t) { T = t; document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); render(); }

    function render() {
      const s = DATA.stats;
      $('#kpis').innerHTML = [
        ['Accounts', s.users], ['Actief (7 d)', s.actief7d ?? '–'], ['Video’s', s.videos], ['Reacties', s.comments],
        ['Open meldingen', s.reportsOpen], ['Weergaven', s.views], ['Groepen', s.groepen ?? 0], ['Nu LIVE', s.lives ?? 0],
      ].map(([l, n]) => `<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

      const thumb = v => v && v.thumb ? `<img src="${esc(v.thumb)}">` : `<div class="noimg"></div>`;
      let h = '';
      if (T === 'reports') {
        if (!DATA.reports.length) h = '<p class="muted">Geen meldingen.</p>';
        for (const r of DATA.reports) {
          const soort = r.soort || 'video';
          let doel = '', acties = '';
          if (soort === 'video') { doel = `video: ${r.video && r.video.weg ? '(al weg)' : '@' + esc(r.video.author) + ' — ' + esc(r.video.caption || '')}`; if (r.video && !r.video.weg) acties = `<a href="${esc(r.video.url)}" target="_blank"><button class="grey">Bekijk</button></a><button class="red" onclick="delVideo('${r.video.id}')">Video weg</button>`; }
          if (soort === 'reactie') { doel = `reactie: ${r.reactie.weg ? '(al weg)' : '@' + esc(r.reactie.author) + ' — “' + esc(r.reactie.text || '(foto)') + '”'}`; if (!r.reactie.weg) acties = `<button class="red" onclick="delComment('${r.reactie.id}')">Reactie weg</button>`; }
          if (soort === 'account') { doel = `account: ${r.account.weg ? '(al weg)' : '@' + esc(r.account.username) + ' (' + esc(r.account.name) + ')'}`; if (!r.account.weg) acties = `<button class="grey" onclick="schors('${r.account.id}',7)">Schors 7 d</button><button class="red" onclick="delUser('${r.account.id}','${esc(r.account.username)}')">Account weg</button>`; }
          h += `<div class="row ${r.done ? '' : 'open'}">
            ${soort === 'video' ? thumb(r.video) : soort === 'reactie' && r.reactie.foto ? `<img src="${esc(r.reactie.foto)}">` : `<div class="noimg" style="display:grid;place-items:center;font-size:22px">${soort === 'reactie' ? '💬' : '👤'}</div>`}
            <div class="m"><div class="t">${esc(r.reason || '(geen reden opgegeven)')}</div>
            <div class="s">door @${esc(r.reporter)} · ${when(r.created)}${r.done ? ' · afgehandeld' : ''}</div>
            <div class="s">${doel} <span class="ip">${esc(r.ip || '')}</span></div></div>
            <div class="actions">${acties}${r.done ? '' : `<button class="grey" onclick="klaar('${r.id}')">Klaar</button>`}</div></div>`;
        }
      } else if (T === 'videos') {
        for (const v of DATA.videos) {
          h += `<div class="row ${v.uitgelicht ? 'open' : ''}">${thumb(v)}
            <div class="m"><div class="t">${v.uitgelicht ? '⭐ ' : ''}${v.story ? '⏳ ' : ''}${esc(v.caption || '(geen tekst)')}</div>
            <div class="s">@${esc(v.author)} · ${v.views} weergaven · ${v.likes} likes · ${when(v.created)}</div>
            <div class="s ip">${esc(v.ip || '')}</div></div>
            <div class="actions"><a href="${esc(v.url)}" target="_blank"><button class="grey">Bekijk</button></a>
            <button class="grey" onclick="uitlichten('${v.id}')">${v.uitgelicht ? 'Niet meer uitlichten' : '⭐ Uitlichten'}</button>
            <button class="red" onclick="delVideo('${v.id}')">Verwijder</button></div></div>`;
        }
      } else if (T === 'users') {
        for (const u of DATA.users) {
          h += `<div class="row ${u.schorsTot ? 'open' : ''}"><div class="noimg"></div>
            <div class="m"><div class="t">${esc(u.name)} ${u.verified ? '<span style="color:#4cc3ff">✔</span>' : ''} <span class="muted">@${esc(u.username)}</span>${u.schorsTot ? ` <span style="color:#ff9a9a">geschorst tot ${when(u.schorsTot)}</span>` : ''}</div>
            <div class="s">${u.videos} video’s · lid sinds ${when(u.created)} · laatst ${when(u.lastSeen)}</div>
            <div class="s ip">aanmeld-IP ${esc(u.ip || '?')} · laatste IP ${esc(u.lastIp || '?')}</div></div>
            <div class="actions"><button class="grey" onclick="verifieer('${u.id}')">${u.verified ? 'Vinkje weg' : '✔ Verifieer'}</button>
            ${u.schorsTot ? `<button class="grey" onclick="schors('${u.id}',0)">Schorsing opheffen</button>` : `<button class="grey" onclick="schors('${u.id}',7)">Schors 7 d</button>`}
            <button class="red" onclick="delUser('${u.id}','${esc(u.username)}')">Account weg</button></div></div>`;
        }
      } else if (T === 'dash') {
        const max = k => Math.max(1, ...DATA.perDag.map(d => d[k]));
        const bars = (k, l) => `<div class="kpi" style="margin-bottom:10px"><div class="l" style="margin-bottom:6px">${l}</div><div style="display:flex;align-items:flex-end;gap:3px;height:90px">${DATA.perDag.map(d => `<div title="${d.dag}: ${d[k]}" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%"><i style="display:block;width:100%;min-height:2px;height:${Math.round(d[k] / max(k) * 100)}%;background:#ff7a1a;border-radius:3px 3px 0 0"></i><span style="font-size:9px;color:#9a9aad">${d.dag.slice(8)}</span></div>`).join('')}</div></div>`;
        h = bars('accounts', 'Nieuwe accounts per dag (14 dagen)') + bars('posts', 'Nieuwe posts per dag') + bars('views', 'Weergaven per dag');
      } else if (T === 'woorden') {
        h = `<div class="kpi"><div class="l" style="margin-bottom:8px">Woorden die nergens op FlikFlak mogen (reacties en bijschriften worden geweigerd). Komma's ertussen. Dit staat los van de persoonlijke woordfilter van makers.</div>
          <textarea id="woorden" rows="4" maxlength="4000" style="width:100%;padding:10px;border-radius:10px;border:1px solid #333;background:#0b0b0f;color:#eee;font-size:15px">${esc((DATA.blokwoorden || []).join(', '))}</textarea>
          <div style="margin-top:10px;display:flex;gap:8px;align-items:center"><button onclick="woordenOpslaan()">Opslaan</button><span class="muted" id="woordenUit">${(DATA.blokwoorden || []).length} woorden</span></div></div>`;
      } else if (T === 'aank') {
        h = `<div class="kpi"><div class="l" style="margin-bottom:8px">Stuur een aankondiging naar alle accounts (komt in hun Inbox → Activiteit, van het officiële FlikFlak-account).</div>
          <textarea id="aankTekst" rows="3" maxlength="300" style="width:100%;padding:10px;border-radius:10px;border:1px solid #333;background:#0b0b0f;color:#eee;font-size:15px" placeholder="Bijv. Nieuw: stories en groepschats! Probeer ze vandaag."></textarea>
          <div style="margin-top:10px;display:flex;gap:8px;align-items:center"><button onclick="aankondig()">Versturen naar iedereen</button><span class="muted" id="aankUit"></span></div></div>`;
      }
      $('#list').innerHTML = h;
    }
    async function verifieer(id) { await api('POST', '/user/' + id + '/verifieer'); await herlaad(); }
    async function delComment(id) { if (confirm('Deze reactie verwijderen?')) { await api('DELETE', '/comment/' + id); await herlaad(); } }
    async function woordenOpslaan() { const woorden = $('#woorden').value.split(/[,\n]/).map(w => w.trim()).filter(Boolean); const r = await fetch('/api/admin/blokwoorden', { method: 'POST', headers: { 'x-admin': TOKEN, 'content-type': 'application/json' }, body: JSON.stringify({ woorden }) }).then(r => r.json()); $('#woordenUit').textContent = (r.blokwoorden || []).length + ' woorden opgeslagen'; DATA.blokwoorden = r.blokwoorden || []; }
    async function schors(id, dagen) { if (dagen && !confirm('Dit account ' + dagen + ' dagen schorsen? De persoon kan niet inloggen en zijn video’s zijn tijdelijk onzichtbaar.')) return; await fetch('/api/admin/user/' + id + '/schors', { method: 'POST', headers: { 'x-admin': TOKEN, 'content-type': 'application/json' }, body: JSON.stringify({ dagen }) }); await herlaad(); }
    async function uitlichten(id) { await api('POST', '/video/' + id + '/uitlichten'); await herlaad(); }
    async function aankondig() { const t = $('#aankTekst').value.trim(); if (!t) return; if (!confirm('Naar alle accounts sturen?')) return; const r = await fetch('/api/admin/aankondiging', { method: 'POST', headers: { 'x-admin': TOKEN, 'content-type': 'application/json' }, body: JSON.stringify({ text: t }) }).then(r => r.json()); $('#aankUit').textContent = r.ok ? 'Verstuurd naar ' + r.ontvangers + ' accounts' : (r.error || 'Mislukt'); if (r.ok) $('#aankTekst').value = ''; }
    async function klaar(id) { await api('POST', '/report/' + id + '/klaar'); await herlaad(); }
    async function delVideo(id) { if (confirm('Deze video definitief verwijderen?')) { await api('DELETE', '/video/' + id); await herlaad(); } }
    async function delUser(id, name) { if (confirm('Account @' + name + ' en al zijn video’s verwijderen?')) { await api('DELETE', '/user/' + id); await herlaad(); } }

    if (TOKEN) start();
  </script>
</body>
</html>
