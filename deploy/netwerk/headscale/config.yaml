# ZekerFlex VPN-server (Headscale 0.29, lib/netwerk/headscale.ts): de vrije
# tegenhanger van Tailscale, op de eigen server. Caddy zet vpn.zekerflex.com
# door naar poort 8080 (TLS doet Caddy). De ingebouwde DERP-relay (met STUN op
# 3479/udp, 3478 is van coturn) zorgt dat verbindingen ook achter strenge
# firewalls werken, zonder relays van Tailscale of anderen.
server_url: https://vpn.zekerflex.com
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: true
    region_id: 999
    region_code: "zekerflex"
    region_name: "ZekerFlex (Nederland)"
    verify_clients: true
    stun_listen_addr: "0.0.0.0:3479"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 37.97.226.24
  # geen relays van Tailscale: alles blijft op de eigen server
  urls: []
  paths: []
  auto_update_enabled: false
  update_frequency: 24h

disable_check_updates: true

node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

log:
  level: info
  format: text

# toegangsregels in de database van headscale, gezet met
#   docker exec -i zekerflex-headscale-1 headscale policy set -f /dev/stdin < deploy/netwerk/headscale/policy.json
# (apparaten zien alleen apparaten van dezelfde gebruiker, dus van hetzelfde bedrijf)
policy:
  mode: database

dns:
  magic_dns: false
  base_domain: zf.internal
  override_local_dns: false
  nameservers:
    global: []
    split: {}
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false

taildrop:
  enabled: false
