# ZekerFlex wifi op de werkvloer (lib/netwerk): de RADIUS-server kent de
# wifi-apparatuur van klanten niet van tevoren. Elke vestiging meldt zich met
# haar vaste IP-adres; de app zegt welk geheim erbij hoort (dynamic clients,
# sites-enabled/zf-clients → /api/netwerk/radius/client). Een onbekend IP
# krijgt geen antwoord.
client zf-dynamisch {
	ipaddr = 0.0.0.0/0
	dynamic_clients = zf-clients
	lifetime = 3600
	rate_limit = yes
}
